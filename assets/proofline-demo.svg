<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-label="Proofline terminal demo showing a passing evidence pack">
  <rect width="1200" height="690" fill="#0d1117" rx="18"/>
  <circle cx="42" cy="38" r="10" fill="#ff5f57"/><circle cx="72" cy="38" r="10" fill="#febc2e"/><circle cx="102" cy="38" r="10" fill="#28c840"/>
  <text x="600" y="44" fill="#8b949e" font-family="Menlo, Monaco, monospace" font-size="18" text-anchor="middle">proofline — local evidence pack</text>
  <g font-family="Menlo, Monaco, monospace" font-size="22" fill="#c9d1d9">
    <text x="46" y="100" fill="#7ee787">$</text><text x="70" y="100">PYTHONPATH=src python -m proofline check --test "python -m unittest discover -s tests -q"</text>
    <text x="46" y="150" fill="#58a6ff">Proofline evidence pack</text>
    <text x="46" y="195">Repository: local Git working tree</text>
    <text x="46" y="235">Changed files: 1   Lines: +13 / -2</text>
    <text x="46" y="290" fill="#58a6ff">Changed files</text>
    <text x="46" y="330">src/proofline/git.py                      +13  -2</text>
    <text x="46" y="390" fill="#58a6ff">Test evidence</text>
    <text x="46" y="430">Command: python -m unittest discover -s tests -q</text>
    <text x="46" y="470">Status: </text><text x="150" y="470" fill="#7ee787">passed</text>
    <text x="46" y="510">Ran 3 tests in 0.105s</text>
    <text x="46" y="550" fill="#7ee787">OK</text>
    <text x="46" y="625" fill="#8b949e">Reproducible terminal demo; no AI-generated product imagery.</text>
  </g>
</svg>
